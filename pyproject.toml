[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dripcut"
version = "1.0.0rc1"
description = "DripCut - creator-first video clipping, captions, AI assistance, and scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DripCut" }]
keywords = ["video", "ffmpeg", "shorts", "reels", "clips", "subtitles", "saas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

dependencies = [
    "gradio>=4.44",
    "faster-whisper>=1.0",
    "pysubs2>=1.6",
    "scenedetect>=0.6.3",
    "opencv-python-headless>=4.9",
    "ffmpeg-python>=0.2",
    "numpy>=1.26",
    "pillow>=10.0",
    "rich>=13.7",
    "yt-dlp[default]>=2026.7.4",
    "bgutil-ytdlp-pot-provider>=2.0.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "certifi>=2024.7.4",
    "groq>=0.31",
    "boto3>=1.35",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
media = ["moviepy>=1.0.3"]

[project.scripts]
dripcut = "dripcut.cli.main:main"

[project.entry-points."dripcut.plugins"]
thumbnail_grid = "dripcut.plugins.builtin.thumbnail_grid:ThumbnailGridPlugin"
loudness = "dripcut.plugins.builtin.loudness:LoudnessPlugin"
social_presets = "dripcut.plugins.builtin.social_presets:SocialPresetsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dripcut = ["ui/assets/*.css", "ui/assets/*.js", "ui/assets/*.svg", "ui/assets/*.png", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Plugin hooks receive the shared context by contract; not every hook uses it.
"src/dripcut/plugins/**" = ["ARG002"]
# Test doubles often need callback signatures whose arguments are intentionally unused.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
