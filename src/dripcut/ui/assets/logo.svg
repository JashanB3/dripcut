<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="DripCut">
  <defs>
    <linearGradient id="dc-logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#7A5BFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#dc-logo-grad)"/>
  <!-- sprocket notches: the filmstrip motif used throughout the interface -->
  <g fill="#111524" opacity="0.34">
    <rect x="5" y="7" width="3" height="4" rx="1"/>
    <rect x="5" y="14" width="3" height="4" rx="1"/>
    <rect x="5" y="21" width="3" height="4" rx="1"/>
    <rect x="5" y="28" width="3" height="4" rx="1"/>
    <rect x="32" y="7" width="3" height="4" rx="1"/>
    <rect x="32" y="14" width="3" height="4" rx="1"/>
    <rect x="32" y="21" width="3" height="4" rx="1"/>
    <rect x="32" y="28" width="3" height="4" rx="1"/>
  </g>
  <!-- droplet cut in half: "drip" + "cut" -->
  <path d="M20 9c3.6 4.2 6.4 7.7 6.4 11.3A6.4 6.4 0 0 1 20 26.7a6.4 6.4 0 0 1-6.4-6.4C13.6 16.7 16.4 13.2 20 9Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M20 31.5V8.5" stroke="#111524" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <circle cx="20" cy="20.3" r="2.1" fill="#26D0A5"/>
</svg>
